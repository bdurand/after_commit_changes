name: Continuous Integration

on:
  push:
    branches:
      - main
      - actions-*
    tags:
      - v*
  pull_request:
    branches-ignore:
      - actions-*
  workflow_dispatch:

jobs:
  specs:
    name: Run specs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "ruby"
            standardrb: true
            yard: true
          - ruby: "3.4"
            appraisal: "activerecord_8"
          - ruby: "3.3"
            appraisal: "activerecord_8.0"
          - ruby: "3.2"
            appraisal: "activerecord_7"
          - ruby: "3.1"
            appraisal: "activerecord_7.0"
          - ruby: "3.0"
            appraisal: "activerecord_6"
          - ruby: "2.6"
            appraisal: "activerecord_6.0"
    steps:
      - name: Ruby CI
        uses: bdurand/github-actions/ruby-ci@v1
        with:
          ruby: ${{ matrix.ruby }}
          appraisal: ${{ matrix.appraisal }}
          bundler: ${{ matrix.bundler }}
          standardrb: ${{ matrix.standardrb }}
          yard: ${{ matrix.yard }}
