name: Continuous Integration

on:
  push:
    branches:
      - main
      - actions-*
    tags:
      - v*
  pull_request:
    branches-ignore:
      - actions-*
  workflow_dispatch:

env:
  BUNDLE_CLEAN: "true"
  BUNDLE_PATH: vendor/bundle
  BUNDLE_JOBS: 3
  BUNDLE_RETRY: 3

jobs:
  specs:
    name: Run specs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "ruby"
            standardrb: true
            yard: true
          - ruby: "3.4"
            appraisal: "activerecord_8"
          - ruby: "3.3"
            appraisal: "activerecord_8.0"
          - ruby: "3.2"
            appraisal: "activerecord_7"
          - ruby: "3.1"
            appraisal: "activerecord_7.0"
          - ruby: "3.0"
            appraisal: "activerecord_6"
          - ruby: "2.5"
            appraisal: "activerecord_6.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "${{ matrix.ruby }}"
      - name: Setup bundler
        if: matrix.bundler != ''
        run: |
          gem uninstall bundler --all
          gem install bundler --no-document --version ${{ matrix.bundler }}
      - name: Set Appraisal bundle
        if: matrix.appraisal != ''
        run: |
          gemfile="gemfiles/${{ matrix.appraisal }}.gemfile"
          echo "using gemfile $gemfile"
          sed -i '/^BUNDLED WITH$/,+1d' "$gemfile.lock"
          echo "BUNDLE_GEMFILE=$gemfile" >> "$GITHUB_ENV"
      - name: Install bundler
        run: |
          bundle update
      - name: Run specs
        run: |
          bundle exec rake spec
        env:
          RUBYOPT: '--enable=frozen-string-literal --debug=frozen-string-literal'
      - name: Run standardrb
        if:   matrix.standardrb == true
        run:  bundle exec rake standard
      - name: yard
        if: matrix.yard == true
        run:  bundle exec yard doc --fail-on-warning
